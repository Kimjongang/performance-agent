# GitHub Actions workflow for concert-agent
name: Concert Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "45 11,18 * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write

concurrency:
  group: concert-agent-production
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run concert agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          BLOTATO_X_ACCOUNT_ID: ${{ secrets.BLOTATO_X_ACCOUNT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python src/main.py

      - name: Persist production memory
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f bridge/memory/events.json && git add -f bridge/memory/events.json
          test -f bridge/memory/publish_state.json && git add -f bridge/memory/publish_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist concert agent memory"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
